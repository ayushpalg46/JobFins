# ===================================================================
# JobFins - Production MySQL Configuration
# ===================================================================

# Application Name & Dynamic Port (Render uses $PORT)
spring.application.name=jobfins
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Configuration (MySQL / PostgreSQL / Embedded Fallback)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:jobfins_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# -------------------------------------------------------------------
# Hibernate & JPA Properties (Auto DDL Schema Generation)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:JobFinsSecretKeyForJwtSigningMustBeAtLeast256BitsLongForSecurityPurpose123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

